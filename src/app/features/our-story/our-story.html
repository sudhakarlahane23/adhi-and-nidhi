  <!-- ================= OUR JOURNEY ================= -->
<section class="journey-section">
  <div class="container">
    <div class="section-title">
      <h2><span class="deco"></span>Our Journey<span class="deco"></span></h2>
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4 journey-track">
      <div class="col" *ngFor="let step of journeySteps">
        <div class="journey-item">
          <div class="journey-icon" [innerHTML]="step.icon"></div>
          <h6 [innerHTML]="step.title"></h6>
          <p>{{ step.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>


  <app-founders></app-founders>

  <!-- ================= WHY FAMILIES TRUST US ================= -->
  <section class="trust-section">
    <div class="container">
      <div class="section-title">
        <h2><span class="deco"></span>Why Families Trust Us<span class="deco"></span></h2>
      </div>
      <div class="row row-cols-3 row-cols-md-3 row-cols-lg-6 g-3">
        <div class="col" *ngFor="let item of trustItems">
          <div class="trust-card">
            <span [innerHTML]="item.icon"></span>
            <span [innerHTML]="item.label"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <app-first-four-supporters></app-first-four-supporters>

  <app-categories></app-categories>
  

  <section class="section offer-banner">
    <div class="container position-relative">
      <div class="row align-items-center g-4">
        <div class="col-lg-8">
          <p class="eyebrow">🎁 Free Gift on Every Order Above ₹999</p>
          <h2>Shop for ₹999 or more and receive a complimentary gift worth up to ₹100!</h2>
        </div>
        <div class="col-lg-4 text-lg-end">
          <a class="btn btn-light" routerLink="/products">Shop Now!</a>
        </div>
      </div>
      <div class="offer-banner-divider"></div>
    </div>
  </section>
</main>
